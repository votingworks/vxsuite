packages:
  # include all the apps, frontends (+ prodservers) and backends
  - 'apps/*/frontend'
  - 'apps/*/frontend/prodserver'
  - 'apps/*/backend'
  - 'apps/*/integration-testing'
  - 'apps/*/playwright'

  # include all the libraries and our custom types
  - 'libs/*'
  - 'libs/@types/*'
  - 'libs/grout/*'
  - 'libs/dev-dock/*'

  # include top-level development project
  - 'codemods'
  - 'script'

# Packages may only access what they explicitly depend on.
hoist: false

# From `pnpm` docs on `publicHoistPattern`: "This setting is useful when dealing
# with some flawed pluggable tools that don't resolve dependencies properly."
# These tools all fit that description.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*stylelint*'

overrides:
  '@vitest/eslint-plugin>@typescript-eslint/scope-manager': 8.70.0
  'brace-expansion@1': ^1.1.13
  'brace-expansion@2': ^2.0.2
  canvas: 3.2.3
  'eslint-plugin-storybook>@typescript-eslint/types': 8.70.0
  graceful-fs: ^4.2.9
  nan: ^2.28.0
  'postcss-styled-syntax>@typescript-eslint/typescript-estree': 8.70.0
  typescript: npm:@typescript/typescript6@6.0.2

patchedDependencies:
  '@fortawesome/react-fontawesome@3.5.0': patches/@fortawesome__react-fontawesome@3.5.0.patch

# typescript-eslint runs against the classic compiler API from the
# `@typescript/typescript6` alias (see CLAUDE.md), which satisfies its
# `typescript` peer range. But peer *resolution* can instead find the
# `@typescript/native` alias (real package name `typescript`, v7.x) hoisted at
# the workspace root and warn about an unmet peer, even though typescript-eslint
# never loads that copy. Allow any version to silence that false positive.
peerDependencyRules:
  allowedVersions:
    'jsdom>canvas': '3'
    '@typescript-eslint/parser>typescript': '*'
    '@typescript-eslint/typescript-estree>typescript': '*'
    '@typescript-eslint/project-service>typescript': '*'
    '@typescript-eslint/tsconfig-utils>typescript': '*'

# Which dependency build scripts may run. `true` = native/binary modules we
# rely on and want built; `false` = packages whose postinstall we intentionally
# skip (funding banners / unused codegen). Any unlisted build script fails the
# install (`strictDepBuilds`) until a human classifies it here.
allowBuilds:
  better-sqlite3: true
  canvas: true
  esbuild: true
  node-hid: true
  node-quirc: true
  pcsclite: true
  usb: true
  core-js: false
  core-js-pure: false
  protobufjs: false
  unrs-resolver: false
