inheritedBy:
  toolchains:
    or: ['javascript', 'typescript']

# `tsconfig.build.json` is intentionally NOT in `sources`: only the `build` task
# consumes it (`tsc --build tsconfig.build.json`), so it's declared as a build
# input below. Keeping it out of the shared group means test/type-check/lint
# don't spuriously invalidate on build-config changes, and native libs that have
# no build tsconfig (e.g. logging-utils) don't warn about a missing input.
fileGroups:
  sources:
    - 'src/**/*'
    - 'tsconfig.json'
    - '/tsconfig.shared.json'

tasks:
  build:
    command: 'tsc --build tsconfig.build.json'
    inputs:
      - '@group(sources)'
      - 'tsconfig.build.json'
    # Only `build/` is declared as an output. With `outDir: build` and no
    # explicit `tsBuildInfoFile` (validate-monorepo forbids setting that in
    # tsconfig.build.json), `tsc --build` writes the incremental state to
    # `build/tsconfig.build.tsbuildinfo` — i.e. INSIDE build/ — so caching build/
    # already captures it, and a cache hit restores build/ and its tsbuildinfo as
    # a consistent pair. Declaring a package-root `tsconfig.build.tsbuildinfo`
    # output (as an earlier revision did) is wrong: that file doesn't exist for a
    # clean build, so moon fails the task with `missing_outputs`.
    outputs:
      - 'build'
    deps:
      - '^:build'

  test:
    # `FORCE_COLOR=0` (inline, so it wins over moon's inherited/injected value):
    # moon forces color for piped tasks, but the normal per-package CI runner does
    # not. Some tests snapshot diff output that colorizes based on it (e.g.
    # test-utils' mockFunction errors embed a jest-diff), so forced color breaks
    # the color-free committed snapshots. `script` (not `command`) so the inline
    # env assignment is honored by the shell.
    #
    # maxWorkers=1 caps vitest's own worker pool to ONE: moon runs up to
    # MOON_CONCURRENCY test tasks at once and each vitest otherwise sizes its pool
    # to all cores, so N suites x cores oversubscribes the CPU and flakes timing-
    # sensitive tests (crypto that shells out to openssl, jsdom render timeouts).
    # With 1 worker per suite, total test threads ~= MOON_CONCURRENCY, so
    # `script/moon` (MOON_CONCURRENCY ~= cores/2) keeps load ~cores. (2 workers x
    # cores/2 concurrency was ~1.5x oversubscribed once coverage/jsdom overhead is
    # counted, and still tripped 5s timeouts. moon has no committable concurrency
    # setting, so the runner concurrency is env-only.)
    #
    # `--coverage` matches each package's real `test:ci` and enforces the shared
    # 100% line/branch thresholds — WITHOUT it moon runs a bare `vitest run` and
    # the coverage gate is silently unenforced. The gate is checked at run time
    # (vitest exits non-zero below threshold), so a cache hit already implies it
    # passed. Outputs stay empty on purpose: junit (reports/junit.xml) is only
    # written when CI, so declaring it as an output makes moon fail LOCAL runs
    # with `missing_outputs`. CI still collects junit for tasks that actually ran
    # (see the moon-ci job's store_test_results); cached tasks don't re-report,
    # which is fine — they passed unchanged.
    script: 'FORCE_COLOR=0 vitest run --coverage --maxWorkers=1'
    env:
      TZ: America/Anchorage
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  type-check:
    # `tsc -p … --noEmit`, NOT `tsc --build`. Build mode walks the project
    # references and REBUILDS each dependency, comparing restored-from-cache
    # `build/` + tsbuildinfo mtimes against fresh-checkout source — a
    # non-deterministic desync (a dep gets partially recompiled against a stale
    # cached `.d.ts`), which produced spurious CI-only errors like
    # `utils/src/polls.ts … TS2345 … not assignable to 'never'` while the source
    # was actually exhaustive. `-p` (non-build) never recompiles a referenced
    # project: it type-checks THIS project's own sources against each
    # dependency's already-built `.d.ts` (deps built via `^:build`). Each project
    # validates its own code; dependents trust the `.d.ts` a dep's own
    # `type-check` task already verified — a cleaner separation than build mode's
    # redundant whole-graph recheck, and immune to the cache desync. It writes a
    # local `tsconfig.tsbuildinfo` (composite ⇒ incremental) but that's gitignored
    # and NOT a moon output, so it is never cached/restored across machines.
    command: 'tsc -p tsconfig.json --noEmit'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  lint:
    command: 'eslint .'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
      - '.eslintignore'
      - '.eslintrc.json'
    outputs: []
    deps:
      - 'type-check'
