inheritedBy:
  toolchains:
    or: ['javascript', 'typescript']

fileGroups:
  sources:
    - 'src/**/*'
    - 'tsconfig.json'
    - 'tsconfig.build.json'
    - '/tsconfig.shared.json'

tasks:
  build:
    command: 'tsc --build tsconfig.build.json'
    inputs:
      - '@group(sources)'
    outputs:
      - 'build'
    deps:
      - '^:build'

  test:
    # `FORCE_COLOR=0` (inline, so it wins over moon's inherited/injected value):
    # moon forces color for piped tasks, but the normal per-package CI runner does
    # not. Some tests snapshot diff output that colorizes based on it (e.g.
    # test-utils' mockFunction errors embed a jest-diff), so forced color breaks
    # the color-free committed snapshots. `script` (not `command`) so the inline
    # env assignment is honored by the shell.
    #
    # maxWorkers=2 caps vitest's own worker pool: moon runs up to MOON_CONCURRENCY
    # test tasks at once and each vitest otherwise sizes its pool to all cores, so
    # N suites x cores oversubscribes the CPU and flakes timing-sensitive tests.
    # Test-phase threads are then ~= MOON_CONCURRENCY x 2; keep MOON_CONCURRENCY
    # around cores/2 (env-only; moon has no committable concurrency setting).
    script: 'FORCE_COLOR=0 vitest run --maxWorkers=2'
    env:
      TZ: America/Anchorage
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  type-check:
    command: 'tsc --build tsconfig.json'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  lint:
    command: 'eslint .'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
      - '.eslintignore'
      - '.eslintrc.json'
    outputs: []
    deps:
      - 'type-check'
