inheritedBy:
  toolchains:
    or: ['javascript', 'typescript']

fileGroups:
  sources:
    - 'src/**/*'
    - 'tsconfig.json'
    - 'tsconfig.build.json'
    - '/tsconfig.shared.json'

tasks:
  build:
    command: 'tsc --build tsconfig.build.json'
    inputs:
      - '@group(sources)'
    outputs:
      - 'build'
    deps:
      - '^:build'

  test:
    # Cap vitest's own worker pool. moon runs up to MOON_CONCURRENCY test tasks at
    # once, and each vitest defaults to a pool sized to all cores — so N suites x
    # cores massively oversubscribes the CPU and makes timing-sensitive tests flake.
    # With maxWorkers=2, test-phase threads are ~= MOON_CONCURRENCY x 2; keep
    # MOON_CONCURRENCY around cores/2 (env-only; moon has no committable setting).
    command: 'vitest run --maxWorkers=2'
    env:
      TZ: America/Anchorage
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  type-check:
    command: 'tsc --build tsconfig.json'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
    outputs: []
    deps:
      - '^:build'

  lint:
    command: 'eslint .'
    inputs:
      - '@group(sources)'
      - 'test/**/*'
      - '.eslintignore'
      - '.eslintrc.json'
    outputs: []
    deps:
      - 'type-check'
