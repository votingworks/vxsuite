# Vite-built React frontend; shared build/lint live in .moon/tasks/vite-frontend.yml.
tags:
  - 'vite-app'

tasks:
  # design-frontend is the one app whose tests expect UTC (its real test:ci sets
  # no TZ); the shared test task forces TZ=America/Anchorage, which shifts a
  # rendered election date back a day. Override back to UTC.
  test:
    env:
      TZ: 'UTC'
