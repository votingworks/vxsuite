# Vite-built React frontend (same shape as admin-frontend): build via `vite build`
# (emits to build/, matching the inherited output) instead of `tsc --build`, and
# lint also runs stylelint. type-check and test (vitest --coverage) inherit.
# (design-frontend tests don't need the DB — only design-backend does.)
tasks:
  build:
    command: 'vite build'
    options:
      mergeArgs: replace
    deps:
      - '^:build'
    outputs:
      - 'build'

  lint:
    script: 'eslint --cache . && pnpm stylelint:run'
    options:
      mergeArgs: replace

  # Unlike every other app, design-frontend's real test:ci sets NO TZ (so it runs
  # under the CI system TZ = UTC), and its date-rendering tests expect that. The
  # shared test task forces TZ=America/Anchorage (UTC-9), which shifts a rendered
  # election date back a day (a "Nov 5, 2024" assertion fails). Override TZ to UTC
  # here to match the package's actual test environment.
  test:
    env:
      TZ: 'UTC'
