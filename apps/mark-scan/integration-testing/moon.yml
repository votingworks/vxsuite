# Playwright e2e suite (same shape as admin-integration-testing): the `e2e` task
# is Playwright, runInCI:false (excluded from `moon ci`) + cache:false, shared
# 'e2e-servers' mutex, depending on the mark-scan app builds. build/type-check/
# test are excluded (test excluded so `moon run :test` stays unit-only; run e2e
# with `moon run :e2e`); lint gets an explicit build gate so eslint-plugin-vx is
# built first. NOTE: mark-scan's suite also needs the accessible-controller/PAT
# daemons built via `make` before Playwright can drive them.
workspace:
  inheritedTasks:
    exclude: ['build', 'type-check', 'test']

tasks:
  e2e:
    script: 'playwright test'
    options:
      mergeArgs: replace
      cache: false
      runInCI: false
      mutex: 'e2e-servers'
    deps:
      - 'mark-scan-backend:build'
      - 'mark-scan-frontend:build'

  lint:
    deps:
      - '^:build'
      - 'eslint-plugin-vx:build'
    options:
      mergeDeps: replace
