version: 2.1

parameters:
  run-job:
    type: boolean
    default: false

executors:
  nodejs:
    docker:
      - image: votingworks/cimg-debian12:4.8.0
        auth:
          username: $VX_DOCKER_USERNAME
          password: $VX_DOCKER_PASSWORD

commands:
  checkout-and-install:
    description: Get the code and install dependencies.
    parameters:
      is_node_package:
        type: boolean
    steps:
      - run:
          name: Ensure Rust tooling is in PATH
          command: |
            echo 'export PATH="/root/.cargo/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Configure Turbo for CI
          command: |
            # Identifies the toolchain that produced cached artifacts.
            echo 'export VX_TOOLCHAIN_ID="votingworks/cimg-debian12:4.8.0"' >> $BASH_ENV
            # Run summaries record each task's hash under .turbo/runs;
            # script/prune-turbo-cache uses them to trim the cache before
            # it is saved.
            echo 'export TURBO_RUN_SUMMARY=true' >> $BASH_ENV
      - run:
          name: Fix node-gyp gyp entrypoint permissions
          command: |
            # TODO: Remove once we upgrade past pnpm 11.10, which ships
            # node-gyp with the gyp entrypoints executable.
            # See https://github.com/pnpm/pnpm/issues/12455
            chmod +x "$(npm root -g)/pnpm/dist/node_modules/node-gyp/gyp/gyp" "$(npm root -g)/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py"
      - checkout
      # Edit this comment somehow in order to invalidate the CircleCI cache.
      # Since the contents of this file affect the cache key, editing only a
      # comment will invalidate the cache without changing the behavior.
      # last edited by Kofi 2024-09-19
      - when:
          condition: << parameters.is_node_package >>
          steps:
            - restore_cache:
                name: Restore Node.js Cache
                key:
                  pnpm-cache-{{ checksum ".circleci/config.yml" }}-{{ checksum
                  "pnpm-lock.yaml" }}
            - run:
                name: Pre-install Node.js headers for node-gyp
                command: |
                  # Concurrent native-module builds during `pnpm install`
                  # race to download and extract the Node headers into the
                  # shared node-gyp devdir, intermittently corrupting the
                  # header tree (builds then fail with errors inside the v8
                  # headers). Extract the headers once up front so the
                  # concurrent builds only ever read them.
                  node "$(npm root -g)/pnpm/dist/node_modules/node-gyp/bin/node-gyp.js" install
            - run:
                name: Install Node.js Dependencies
                command: pnpm install --frozen-lockfile
            - save_cache:
                name: Save Node.js Cache
                key:
                  pnpm-cache-{{ checksum ".circleci/config.yml" }}-{{ checksum
                  "pnpm-lock.yaml" }}
                paths:
                  - /root/.local/share/pnpm/store/v10
                  - /root/.cache/ms-playwright
            - restore_cache:
                name: Restore Turbo Cache
                keys:
                  - turbo-cache-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".circleci/config.yml" }}-main-{{ .Revision }}
                  - turbo-cache-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".circleci/config.yml" }}-main-
      - restore_cache:
          name: Restore Cargo Cache
          key:
            cargo-cache-{{ checksum ".circleci/config.yml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "libs/ballot-interpreter/Cargo.lock" }}-{{ checksum "libs/pdi-scanner/Cargo.lock" }}
      - run:
          name: Install Rust Dependencies
          command: pnpm --recursive install:rust-addon
      - save_cache:
          name: Save Cargo Cache
          key:
            cargo-cache-{{ checksum ".circleci/config.yml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "libs/ballot-interpreter/Cargo.lock" }}-{{ checksum "libs/pdi-scanner/Cargo.lock" }}
          paths:
            - /root/.cargo

jobs:
  # @votingworks/pollbook-backend (conditional - only runs test when backend files change)
  # @votingworks/pollbook-backend
  test-apps-pollbook-backend:
    executor: nodejs
    resource_class: xlarge
    steps:
      - checkout-and-install:
          is_node_package: true
      - run:
          name: Build
          command: |
            pnpm --dir apps/pollbook/backend build
      - run:
          name: Lint
          command: |
            pnpm --dir apps/pollbook/backend lint
      - when:
          condition: << pipeline.parameters.run-job >>
          steps:
            - run:
                name: Test
                command: |
                  pnpm --dir apps/pollbook/backend test:run
                environment:
                  JEST_JUNIT_OUTPUT_DIR: ./reports/
            - store_test_results:
                path: apps/pollbook/backend/reports/
            - store_artifacts:
                path: apps/pollbook/backend/src/__image_snapshots__/__diff_output__/
      - when:
          condition:
            or:
              - equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run:
                name: Prune Turbo Cache
                when: always
                command: |
                  ./script/prune-turbo-cache
            - save_cache:
                name: Save Turbo Cache
                when: always
                key: turbo-cache-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".circleci/config.yml" }}-main-{{ .Revision }}
                paths:
                  - .turbo/cache

workflows:
  test-pollbook-backend:
    jobs:
      - test-apps-pollbook-backend