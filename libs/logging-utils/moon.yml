# logging-utils is fundamentally a Rust (napi) package; its only TypeScript is
# esbuild-run tests. Its real toolchain tasks are cargo-based, so:
#   - exclude the inherited `type-check` entirely (no tsc type-check upstream:
#     no @types/node, tests only ever run through esbuild/vitest)
#   - build -> napi build (emits the .node addon at the package root)
#   - lint  -> cargo clippy (the package's actual lint script); drop the inherited
#     `deps: ['type-check']` since that task no longer exists
#   - test  -> inherited `vitest run`, plus its own `build` so the .node addon
#     exists when the tests load it
# `--offline` keeps cargo off the network (deps are vendored/cached).
workspace:
  inheritedTasks:
    exclude: ['type-check']

tasks:
  build:
    command: 'pnpm build:self'
    options:
      mergeArgs: replace
      mergeOutputs: replace
      # This is a napi/cargo build, not tsc — replace the inherited tsc inputs
      # (which include `tsconfig.build.json`, absent here) with the Rust sources.
      mergeInputs: replace
    # cargo/napi saturate every core internally. Bound the job count so multiple
    # native builds running under moon (and their RAM) don't collectively demand
    # cores x N. Tune down further on RAM-constrained CI.
    env:
      CARGO_BUILD_JOBS: '6'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'build.rs'
    outputs:
      - '*.node'

  lint:
    command: 'cargo clippy --offline'
    options:
      mergeArgs: replace
      mergeDeps: replace

  test:
    deps:
      - 'build'
