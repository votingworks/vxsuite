[workspace]
resolver = "2"

[workspace.package]
license = "GPL-3.0-only"

[workspace.lints.rust]
dead_code = "deny"
unused_assignments = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"

[package]
name = "ballot-encoder"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/rust/lib.rs"

[dependencies]
hex = "0.4.3"
napi = { version = "3.8.0", default-features = false, features = [
  "napi4",
  "serde-json",
  "dyn-symbols",
] }
napi-derive = "3.5.2"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.89"
types-rs = { path = "../types-rs" }

[build-dependencies]
napi-build = "2.3.1"

[lints]
workspace = true
